<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocMsg - شات دكتور مصر</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #e5ddd5; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #075e54; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        .message { max-width: 75%; padding: 8px 12px; border-radius: 10px; font-size: 16px; position: relative; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sent { align-self: flex-start; background-color: #dcf8c6; border-top-left-radius: 0; }
        .received { align-self: flex-end; background-color: white; border-top-right-radius: 0; }
        .sender-name { font-size: 12px; font-weight: bold; color: #075e54; margin-bottom: 4px; display: block; }
        .time { font-size: 10px; color: #888; margin-top: 4px; text-align: left; }
        .footer { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; }
        input { flex: 1; padding: 12px 15px; border: none; border-radius: 25px; outline: none; font-size: 16px; }
        button { background-color: #075e54; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<header id="header-title">DocMsg - دكتور مصر 👨‍⚕️</header>

<div id="chat-box"></div>

<div class="footer">
    <input type="text" id="message-input" placeholder="اكتب رسالة..." autocomplete="off">
    <button id="send-btn">➤</button>
</div>

<script>
    // طلب الاسم من المستخدم
    let userName = localStorage.getItem("chat_user_name");
    if (!userName) {
        userName = prompt("مرحباً بك في تطبيق دكتور مصر! ادخل اسمك المستعار:");
        if (!userName) userName = "مجهول";
        localStorage.setItem("chat_user_name", userName);
    }

    const firebaseConfig = {
        databaseURL: "https://dock-massage-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    function sendMessage() {
        const text = messageInput.value.trim();
        if (text !== "") {
            const now = new Date();
            const timeStr = now.getHours() + ":" + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
            
            database.ref("messages").push().set({
                text: text,
                time: timeStr,
                sender: userName
            });
            messageInput.value = "";
        }
    }

    database.ref("messages").on("child_added", (snapshot) => {
        const data = snapshot.val();
        const msgDiv = document.createElement('div');
        // لو المرسل هو نفسه المستخدم الحالي تظهر بلون مختلف
        const isMe = data.sender === userName;
        msgDiv.className = 'message ' + (isMe ? "sent" : "received");
        
        msgDiv.innerHTML = `
            <span class="sender-name">${isMe ? "أنا" : data.sender}</span>
            ${data.text}
            <div class="time">${data.time}</div>
        `;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    sendBtn.onclick = sendMessage;
    messageInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
</script>
<script src="https://pl29460316.effectivecpmnetwork.com/23/71/a5/2371a565d1e1bf6e17a2b81a07273ce1.js"></script>
</body>
</html>
